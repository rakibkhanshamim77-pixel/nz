# Nginx configuration for serving uploaded images from VPS storage.
# Place this inside your existing server {} block, or include it from /etc/nginx/sites-available/neeshanz.conf

# --- Serve uploaded images directly from VPS filesystem (no Next.js involved) ---
location /uploads/ {
    alias /var/www/neeshanz-uploads/;

    # Security: only allow image file types
    location ~* \.(jpg|jpeg|png|webp|gif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";

        # Disable directory listing
        autoindex off;

        # Disable script execution inside the uploads directory
        # (no PHP, CGI, etc. — Nginx just serves files)
    }

    # Block everything that isn't an image
    location ~* ^/uploads/(.*)$ {
        return 403;
    }

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    autoindex off;
}
